'use strict';
const sourceNames={A:'1151006 遊戲式學習_設計方法步驟.pdf',B:'1151006 遊戲式學習_設定學習目標.pdf',C:'1_2_1遊戲式學習_設計方法步驟.pdf',D:'1-1遊戲式學習_介紹_上課講義 (1).pdf'};
const groups=[{name:'學習目標',sub:'先回答「要學會什麼」',color:'#315c87'},{name:'遊戲設計',sub:'把能力轉成玩家行動',color:'#176d62'},{name:'學習歷程',sub:'觀察、回饋與修正',color:'#866018'},{name:'成效證據',sub:'測量、解釋與驗證',color:'#705285'}];
const concepts=[
{id:'core',g:0,r:0,title:'核心融合',sub:'遊戲行為＝學習行為',page:1,summary:'玩家完成任務的操作與思考，同時練習預期的知識、技能或態度。',body:`<h3>兩個核心元素</h3><ul><li><strong>遊戲機制：</strong>任務、規則、互動、關卡、資源與回饋，決定玩家怎麼玩。</li><li><strong>學習內容：</strong>概念、技能與態度，界定預期學會的能力。</li></ul><p>融合的重點，是說清楚哪一個玩家行動對應哪一個學習目標。</p><div class="example"><b>講義案例</b>玩家撰寫與除錯程式，讓機器人通過迷宮。通關所需的程式邏輯與修正行為，就是學習活動。</div><h3>八項核心特色</h3><p>目標與規則、挑戰與回饋、情境化、動機與投入、自主與探索、漸進學習、競爭與合作、獎勵與成就。</p><div class="caution"><b>複習提醒</b>有點數、故事或角色，還需要檢查這些元素如何支援實際的學習目標。</div>`,q:'如何判斷「玩法」與「學習」是否融合？',a:'指出玩家完成任務時，哪個必要的操作或思考正在練習目標能力，並檢查評量是否能看到這個能力。',src:[['A','1–8'],['D','12–13、21']]},
{id:'goals',g:0,r:1,title:'學習目標',sub:'SMART 與雙層目標',page:2,summary:'先界定學生能做什麼，再設計任務、回饋與評量。',body:`<h3>用 SMART 檢查</h3><p>具體（Specific）、可衡量（Measurable）、可達成（Achievable）、相關（Relevant）、有時限（Time-bound）。</p><div class="example"><b>整理補充例</b>完成本次活動後，學生能在五個新情境中，正確選擇至少四個適當的分離方法，並說明所依據的物質性質。標準須依課程與學生調整。</div><h3>區分兩層目標</h3><table><tr><th>學習目標</th><th>玩家目標</th></tr><tr><td>選擇分離方法並說明理由。</td><td>完成基地的物資回收任務。</td></tr></table><p>兩者要對應；學習目的可以向學生說明。「隱性目標」不表示必須隱瞞教學目的。</p><h3>為什麼最關鍵？</h3><p>目標決定內容、機制與評量方向。若目標是說明理由，任務與評量就都要包含理由品質。</p>`,q:'「讓學生覺得遊戲好玩」是否足以作為概念理解的學習目標？',a:'不足。喜好可作為體驗指標，但概念理解需要明確的能力描述，以及能顯示理解的解釋、比較或應用證據。',src:[['A','18–19'],['B','1–4']]},
{id:'ksa',g:0,r:2,title:'知識・技能・態度',sub:'KSA 的任務與證據',page:4,summary:'不同類型的目標，需要對應的任務與學習證據。',body:`<table><tr><th>類型</th><th>遊戲設計</th></tr><tr><td>知識 K</td><td>概念成為線索、資源或環境規則。</td></tr><tr><td>技能 S</td><td>核心操作包含練習、回饋與修正。</td></tr><tr><td>態度 A</td><td>透過角色立場、選擇後果與合作反思。</td></tr></table><h3>測量要對應目標</h3><ul><li>知識：能否解釋概念並在新情境應用。</li><li>技能：能否正確、獨立完成與修正操作。</li><li>態度：選擇理由、反思、互動與態度測量。</li></ul><div class="caution"><b>整理補充｜分類不要混用</b>KSA 是目標類型；Bloom 的記憶、理解、應用、分析、評鑑、創造是認知歷程層次。合作可涉及技能與態度；問題解決不能一概歸為態度。</div>`,q:'培養合作能力，應只測學生喜不喜歡團隊遊戲嗎？',a:'不夠。喜好無法直接代表合作能力，還要看資訊分享、協調、分工與共同修正等互動表現。',src:[['B','9–15'],['A','13']]},
{id:'learner',g:0,r:3,title:'學習者分析',sub:'先備知識與支持需求',page:2,summary:'同一個學習目標，對不同學生可能需要不同的呈現方式、難度與支持。',body:`<h3>分析哪些特徵？</h3><ul><li>年齡、已有概念與先備技能。</li><li>興趣、動機與參與方式。</li><li>數位操作能力與介面理解。</li><li>完成任務時可能需要的提示與引導。</li></ul><div class="example"><b>整理補充例</b>若學生還不理解題目中的基本名詞，直接增加限時壓力可能無法練到預期的推理。可先提供必要說明，再逐步增加整合任務。</div><h3>與目標和鷹架的關係</h3><p>學習目標描述目的地；學習者分析幫助判斷起點；關卡與支持安排兩者之間的學習路徑。</p><p>試玩時應觀察學生是因概念、操作還是規則不清而卡住，再決定如何調整。</p>`,q:'學生一直失敗時，是否只要降低所有關卡難度？',a:'先判讀失敗原因。概念缺口、操作困難與規則不清可能需要不同支持，不能只用單一難度指標處理。',src:[['B','1–3'],['A','18–19']]},
{id:'mechanics',g:1,r:0,title:'任務與核心機制',sub:'把目標轉成操作',page:2,summary:'規則、資源、限制與互動要讓玩家有機會練習目標能力。',body:`<h3>七個設計步驟</h3><ol><li>確立學習目標。</li><li>分析學習者特徵。</li><li>選擇遊戲核心機制。</li><li>嵌入知識學習內容。</li><li>設計回饋與獎勵。</li><li>測試與調整。</li><li>評估學習成效。</li></ol><h3>目標如何影響玩法？</h3><p>知識辨識可使用配對或解謎；技能操作可採模擬與反覆練習；合作目標需要成員協調與互補。具體選擇仍需配合內容及學習者。</p><div class="example"><b>整理補充例</b>規劃物資回收流程時，玩家須選擇、排序操作並預測結果。這些決策對應概念應用與問題解決。</div><div class="caution"><b>設計對齊</b>若只用個人得分判定團隊合作，評分可能沒有反映真正想培養的能力。</div>`,q:'七步驟中哪一步會影響所有其他步驟？',a:'確立學習目標。它決定任務、機制、回饋與評量的方向；後續試玩也可能促使設計者修訂目標或任務。',src:[['A','18–19'],['B','1–3']]},
{id:'integration',g:1,r:1,title:'內生／外生整合',sub:'知識與玩法的關係',page:3,summary:'外生整合附加遊戲獎勵；內生整合把學科規律或技能轉成玩法。',body:`<table><tr><th>外生整合</th><th>內生整合</th></tr><tr><td>答對題目，獲得金幣或攻擊機會。</td><td>理解系統規律並操作，才能達成任務。</td></tr><tr><td>通常較容易更換學科題目。</td><td>更換學科常需重新設計規則。</td></tr></table><h3>內生整合四個方法</h3><ol><li><strong>因果映射：</strong>把學科規律轉成遊戲規則。</li><li><strong>資源與策略權衡：</strong>讓選擇反映概念的應用。</li><li><strong>漸進鷹架：</strong>分階段引入新概念並提供修正線索。</li><li><strong>反思與遷移：</strong>說明概念，再用於新情境。</li></ol><div class="caution"><b>整理補充｜不把類型當成成效結論</b>外生設計不一定無效，內生設計也不保證遷移。仍要檢查學習目標與實際證據。</div>`,q:'會贏內生整合的遊戲，就一定能在現實情境應用嗎？',a:'不能直接認定。需安排概念說明與新情境任務，檢查學生能否把遊戲經驗連到學科知識並遷移。',src:[['A','15–17']]},
{id:'scaffolding',g:1,r:2,title:'關卡與鷹架',sub:'挑戰、提示與漸進',page:5,summary:'逐步增加任務要求，提供適當支持，並觀察學生能否獨立完成。',body:`<h3>難度安排</h3><p>先練習較單純的概念與操作，再進入綜合任務。若學生一直成功，檢查是否已精熟；若一直失敗，先診斷卡住的原因。</p><h3>支持安排</h3><ul><li>引入新概念時提供清楚線索。</li><li>讓失敗結果能顯示哪裡需要修正。</li><li>熟練後逐步減少支持，檢查獨立表現。</li></ul><div class="example"><b>整理補充例</b>第一關辨識資料；第二關選擇與排序操作；整合關卡面對新條件，規劃並解釋完整方案。</div><p>心流關注挑戰與能力的配合；鷹架與最近發展區提醒設計者，學生可能需要支持才能完成當前挑戰。</p>`,q:'若學生靠大量提示過關，如何進一步確認已學會？',a:'逐步減少提示，安排等值或新情境任務，觀察是否能獨立作答、說明理由與修正錯誤。',src:[['A','11、14、17'],['D','16–19、23']]},
{id:'social',g:1,r:3,title:'情意與合作',sub:'角色、選擇與互賴',page:8,summary:'情意與社交目標需要有意義的互動，以及經驗後的反思。',body:`<h3>四個設計原則</h3><ul><li><strong>角色代入：</strong>從不同立場作決策。</li><li><strong>有後果的選擇：</strong>看見決策對資源或關係的影響。</li><li><strong>相互依賴：</strong>分配互補資訊與能力，促成溝通協調。</li><li><strong>安全嘗試：</strong>允許失敗、回顧與再試。</li></ul><div class="example"><b>講義案例</b>一位玩家掌握操作，另一位掌握環境資訊。兩人必須交換資訊，才能共同完成任務。</div><h3>教師引導</h3><p>詢問「你為什麼這樣選？」「合作卡在哪裡？」「如果重來，會如何調整？」「這和生活中的什麼情境相似？」</p><div class="caution"><b>證據界線</b>同組、通關或短暫感動，都不足以單獨證明合作能力或態度已改變。</div>`,q:'讓四個人同組，是否已經完成合作機制的設計？',a:'尚未。需讓任務包含協調與互補需求，並觀察成員如何分享資訊、處理分歧與共同修正。',src:[['C','19–23'],['B','12–15']]},
{id:'feedback',g:2,r:0,title:'AI 診斷式回饋',sub:'從表現找出修正方向',page:5,summary:'AI 可依表現提供引導；回饋應讓學生知道下一步如何檢查與修正。',body:`<h3>學習循環</h3><p>挑戰 → 紀錄表現 → 判讀成功或失敗 → 診斷原因 → 引導提示 → 調整策略 → 再挑戰。</p><h3>提示的層次</h3><ol><li>指出結果與預期之間的差異。</li><li>引導學生檢查自己的決策。</li><li>聚焦關鍵概念或條件。</li><li>安排修正後的再應用。</li></ol><div class="example"><b>整理補充例</b>先問「哪一步的結果與預期不同？」再問「你的選擇利用了哪些條件？」最後要求學生修改一個步驟並說明理由。</div><h3>與獎勵的不同作用</h3><p>分數與徽章標示進展；診斷式回饋還要提供有助修正的資訊。</p><div class="caution"><b>尚待驗證</b>AI 的診斷可能不正確；是否改善學習，必須透過測量確認，不能由「使用 AI」直接推定。</div>`,q:'為什麼「錯了，再試一次」的學習支持有限？',a:'它沒有提供錯誤原因或可檢查的方向，學生可能只反覆猜測。提示應協助聚焦問題並修正策略。',src:[['D','14–19'],['A','11']]},
{id:'srl',g:2,r:1,title:'自我調節學習',sub:'監控、診斷、調整',page:5,summary:'透過多次引導與修正，學生逐步學會管理自己的學習。',body:`<h3>要觀察的行為</h3><ul><li>檢查目前表現與目標的差距。</li><li>分析失敗原因與策略問題。</li><li>調整方法、再次嘗試。</li><li>在需要時主動尋求適當協助。</li></ul><p>在講義的 AI 回饋循環中，最終期待學生能逐漸自行分析錯誤與調整策略。</p><h3>研究中的可能角色</h3><p>自我調節可以是研究關注的結果，也可以在有理論依據的模型中，被設定為介入影響成效的中介過程。</p><div class="example"><b>待檢驗的研究路徑</b>提示方式 → 自我調節學習 → 問題解決表現。箭頭是研究假設，尚未代表因果已獲支持。</div>`,q:'提示使用次數越多，是否代表自我調節越好？',a:'不能只看次數。需要判讀何時求助、如何使用提示，以及是否能調整策略與逐步獨立完成任務。',src:[['D','18–19'],['B','9']]},
{id:'theory',g:2,r:2,title:'學習理論',sub:'理解設計如何發揮作用',page:5,summary:'理論協助解釋機制、學習過程與成果之間可能的關係。',body:`<table><tr><th>理論</th><th>設計連結</th></tr><tr><td>建構主義</td><td>操作、互動、先備知識與反思。</td></tr><tr><td>心流</td><td>挑戰與能力的配合。</td></tr><tr><td>鷹架／最近發展區</td><td>提供適當支持，協助完成當前挑戰。</td></tr><tr><td>自我決定理論</td><td>自主感、勝任感、關係感。</td></tr><tr><td>情境學習</td><td>在有意義的情境中使用知識。</td></tr><tr><td>社會建構</td><td>透過互動與共同討論形成理解。</td></tr></table><h3>如何使用理論？</h3><p>說明哪個設計可能透過什麼過程影響成果，再決定要蒐集哪些證據。僅在文獻中列出理論名稱，尚未完成設計連結。</p><div class="caution"><b>整理補充</b>學習動機與問題解決能力是構念；理論提供解釋架構；量表或任務是蒐集證據的工具。</div>`,q:'列出「心流理論」後，還需要說明什麼？',a:'說明遊戲如何安排挑戰與能力的配合，以及要用什麼資料判斷相關體驗或成效，而非只列名詞。',src:[['D','22–23'],['C','21–23']]},
{id:'transfer',g:2,r:3,title:'反思與遷移',sub:'從會玩到新情境應用',page:3,summary:'把遊戲中的經驗連到學科概念，再檢查是否能處理新任務。',body:`<h3>反思的三個問題</h3><ol><li>剛才採取了什麼行動，結果如何？</li><li>可以用哪個學科概念解釋？</li><li>換成不同情境，哪些原則仍能使用？</li></ol><p>可透過歷程回放、數據圖表與概念命名，協助學生把操作經驗轉成可說明的知識。</p><div class="example"><b>整理補充例</b>完成遊戲任務後，提供不同條件的混合物問題，請學生規劃分離流程並說明理由，觀察是否能獨立應用原理。</div><h3>遷移與保留</h3><p>新情境任務關注能力能否應用到不同問題；適當的延宕測量則關注一段時間後是否仍能表現。兩者測量目的不同。</p>`,q:'原遊戲每關都過，還需要新情境任務嗎？',a:'若要主張遷移，就需要。原遊戲成功可能反映對特定規則或操作的熟悉，新任務可檢查概念是否能再應用。',src:[['A','17'],['B','14'],['C','21']]},
{id:'assessment',g:3,r:0,title:'學習成效評量',sub:'用證據回應學習目標',page:6,summary:'評量要對應預期能力，並區分體驗、歷程與學習成果。',body:`<h3>可以蒐集什麼？</h3><ul><li>概念測驗、解釋題與應用題。</li><li>實作任務與評分規準。</li><li>學習者反思與教師觀察。</li><li>遊戲歷程，例如決策路徑、錯誤修正與提示使用。</li></ul><h3>遊戲分數代表什麼？</h3><p>先檢查分數組成，可能包含作答、速度、道具、運氣或協助程度。若目標是推理品質，總分不一定是合適指標。</p><div class="caution"><b>三個不能直接畫等號的關係</b>覺得好玩 ≠ 已學會；過關成功 ≠ 理解概念；點擊很多 ≠ 深度思考。</div><p>講義提出隱形評量的研究方向：從遊戲歷程推估能力。這仍需建立指標與驗證，不能把任何紀錄直接當成能力證據。</p>`,q:'學生滿意度很高，是否足以證明學習成效提升？',a:'不足。滿意度反映體驗，仍需與學習目標對齊的測驗、實作或其他成果證據。',src:[['B','3–5'],['A','11、19'],['C','18']]},
{id:'operational',g:3,r:1,title:'操作型定義',sub:'把構念轉成測量指標',page:6,summary:'明確規定要觀察什麼、如何測量、如何計分及何時測量。',body:`<h3>從抽象到具體</h3><p>學習目標 → 研究構念 → 任務或工具 → 可觀察指標與計分規則。</p><div class="example"><b>整理補充例｜問題解決</b>在活動後的新情境任務中，用相同評分規準評定問題分析、方案理由及修正品質。實際規準需配合內容並檢查其適用性。</div><table><tr><th>構念／成果</th><th>可能的測量</th></tr><tr><td>知識記憶</td><td>正確辨識或標示的數量。</td></tr><tr><td>技能應用</td><td>實作任務表現與規準評分。</td></tr><tr><td>動機</td><td>適合對象的量表，搭配其他資料。</td></tr></table><div class="caution"><b>解讀界線</b>遊戲行為可以是線索，但必須解釋為何它能反映構念。例如查閱資料次數，單獨並不能代表批判思考。</div>`,q:'「用遊戲總分代表批判思考」算完整的操作型定義嗎？',a:'尚不足。需要說明總分如何由能反映批判思考的表現構成，明定計分方式，並檢查測量是否適切。',src:[['B','5–9']]},
{id:'variables',g:3,r:2,title:'研究變項',sub:'IV、DV 與中介角色',page:6,summary:'先分清比較的條件、觀察的成果，以及假設中的作用過程。',body:`<table><tr><th>角色</th><th>研究例</th></tr><tr><td>自變項 IV</td><td>提示方式：AI 診斷式／固定提示。</td></tr><tr><td>主要依變項</td><td>問題解決表現。</td></tr><tr><td>次要依變項</td><td>同時關注的動機或投入結果。</td></tr><tr><td>可能的中介</td><td>假設介入透過自我調節影響成果。</td></tr></table><h3>主要與次要由目的決定</h3><p>若研究目的就是改善學習動機，動機可以是主要依變項。它不是永遠只能擔任配角。</p><h3>中介要有理論與分析支持</h3><p>「提示 → 自我調節 → 表現」是一個待檢驗模型。三個變項一起改變，不足以直接認定中介成立。</p><div class="caution"><b>整理補充</b>次要依變項與中介變項是不同概念：前者描述結果的研究優先順序，後者描述模型中的作用角色。</div>`,q:'學習動機可以同時被研究為主要成果或中介過程嗎？',a:'可以依不同研究目的設定角色；必須清楚界定模型、假設與測量，不能在結果出來後任意更換解釋。',src:[['B','4–9']]},
{id:'research',g:3,r:3,title:'探索與驗證',sub:'研究目的與假設',page:7,summary:'探索發現現象與可能解釋；驗證檢驗已有依據的推論。',body:`<table><tr><th>探索性問題</th><th>驗證性問題</th></tr><tr><td>學生失敗時如何使用提示？有哪些修正策略？</td><td>AI 診斷式提示是否改善新情境問題解決表現？</td></tr></table><h3>兩種進路</h3><p><strong>探索導向：</strong>發現問題 → 探索 → 建立模型 → 提出假設 → 驗證。</p><p><strong>文獻導向：</strong>發現問題 → 整理既有理論與研究 → 建立架構與假設 → 蒐集資料驗證。</p><p>已有足夠文獻時，可以直接形成假設後驗證。文獻探討不是探索性研究的同義詞。</p><h3>判斷研究設計</h3><ul><li>釐清比較條件，避免多個差異混在一起。</li><li>注意先備能力、時間及教師支持。</li><li>把結果測量與研究目的對齊。</li></ul><div class="caution"><b>整理補充</b>不能只靠「如何／是否」判定研究類型；質性與量化也不是一對一對應。假設仍待驗證，顯著差異也不能單獨支持因果結論。</div>`,q:'每個研究都必須先做一個探索性研究嗎？',a:'不必。若已有充分文獻與理論，可據此建立架構與假設，直接設計驗證研究。',src:[['D','29–42'],['B','13–15']]}
];

const byId=Object.fromEntries(concepts.map(n=>[n.id,n]));
const svg=document.getElementById('map'),reader=document.getElementById('reader'),detail=document.getElementById('detail');
const NS='http://www.w3.org/2000/svg';

function el(tag,attrs={},text){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function position(n){return{x:35+n.g*275,y:142+n.r*160,w:205,h:82}}
function draw(){
 const lanes=document.getElementById('lanes');
 groups.forEach((g,i)=>{const b=document.createElement('button');b.type='button';b.dataset.group=i;b.style.setProperty('--group-color',g.color);b.innerHTML=`<span class="path-title">${g.name}</span><small>${g.sub}</small>`;b.addEventListener('click',()=>select(concepts.find(n=>n.g===i).id));document.querySelector('.learning-path').append(b);const section=document.createElement('section');section.className='concept-group';section.dataset.group=i;section.innerHTML=`<h3 style="--group-color:${g.color}">${g.name}</h3>`;document.querySelector('.concept-list').append(section);});groups.forEach((g,i)=>{lanes.append(el('rect',{x:17+i*275,y:104,width:241,height:637,rx:18,class:'lane-bg'}));lanes.append(el('text',{x:35+i*275,y:49,class:'lane-title'},g.name));lanes.append(el('text',{x:35+i*275,y:76,class:'lane-sub'},g.sub));lanes.append(el('line',{x1:35+i*275,y1:92,x2:240+i*275,y2:92,stroke:g.color,'stroke-width':3}));});
 edges.forEach(([from,to,label,cross],i)=>{const a=position(byId[from]),b=position(byId[to]);let d,lx,ly;if(a.x===b.x){d=`M${a.x+a.w/2} ${a.y+a.h+5} L${b.x+b.w/2} ${b.y-8}`;lx=a.x+a.w/2+10;ly=(a.y+a.h+b.y)/2+4}else{const sx=a.x+a.w+5,sy=a.y+a.h/2,tx=b.x-8,ty=b.y+b.h/2;const mid=(sx+tx)/2;d=`M${sx} ${sy} C${mid} ${sy},${mid} ${ty},${tx} ${ty}`;lx=mid;ly=(sy+ty)/2-10;}document.getElementById('edges').append(el('path',{id:`edge-${i}`,d,class:`edge${cross?' cross':''}`}));document.getElementById('labels').append(el('text',{id:`label-${i}`,x:lx,y:ly,class:`edge-label${cross?' cross':''}`,'text-anchor':a.x===b.x?'start':'middle'},label));});
 concepts.forEach((n,i)=>{const p=position(n),g=el('g',{class:'node',id:`node-${n.id}`,role:'button',tabindex:0,'aria-label':`${n.title}：${n.sub}`,'aria-pressed':'false','data-id':n.id,transform:`translate(${p.x},${p.y})`});g.append(el('rect',{class:'shape',width:p.w,height:p.h,rx:11}));g.append(el('line',{class:'accent',x1:13,y1:19,x2:13,y2:63,stroke:groups[n.g].color}));g.append(el('text',{class:'name',x:26,y:34},n.title));g.append(el('text',{class:'sub',x:26,y:58},n.sub));g.addEventListener('click',()=>{if(!suppressClick)select(n.id);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);}if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const dc=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0,dr=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;const next=concepts.find(v=>v.g===n.g+dc&&v.r===n.r+dr);if(next)document.getElementById(`node-${next.id}`).focus();}});document.getElementById('nodes').append(g);const btn=document.createElement('button');btn.type='button';btn.dataset.id=n.id;btn.style.setProperty('--node-color',groups[n.g].color);btn.innerHTML=`<strong>${n.title}</strong><small>${n.sub}</small>`;btn.addEventListener('click',()=>select(n.id));document.querySelector(`.concept-group[data-group="${n.g}"]`).append(btn);});
}
function allowed(id){return mode==='all'||(mode==='design'?designIds:researchIds).has(id)}
function highlight(){document.querySelectorAll('.learning-path button').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.group)===byId[selected].g)));const near=new Set([selected]);edges.forEach(([a,b])=>{if(a===selected)near.add(b);if(b===selected)near.add(a)});concepts.forEach(n=>{const active=mode==='all'||allowed(n.id)||n.id===selected;const node=document.getElementById(`node-${n.id}`);node.classList.toggle('selected',n.id===selected);node.classList.toggle('related',near.has(n.id)&&n.id!==selected);node.classList.toggle('dim',!active);node.setAttribute('aria-pressed',String(n.id===selected));const btn=document.querySelector(`.concept-list [data-id="${n.id}"]`);btn.classList.toggle('selected',n.id===selected);btn.classList.toggle('visited',visited.has(n.id));btn.classList.toggle('dim',!allowed(n.id));btn.setAttribute('aria-pressed',String(n.id===selected));});edges.forEach(([a,b,label,cross],i)=>{const active=a===selected||b===selected;for(const prefix of ['edge','label']){const e=document.getElementById(`${prefix}-${i}`);e.classList.toggle('active',active);e.classList.toggle('show',Boolean(cross&&active));e.classList.toggle('dim',!active&&(mode==='all'||!allowed(a)||!allowed(b)));}});}
function select(id,updateHash=true){if(!byId[id])id='core';selected=id;visited.add(id);const n=byId[id],idx=concepts.findIndex(v=>v.id===id);reader.style.setProperty('--node-color',groups[n.g].color);const sources=n.src.map(([key,pages])=>`${key}｜${sourceNames[key]}<br>PDF 第 ${pages} 頁`).join('<br>');const adjacent=edges.filter(e=>e[0]===id||e[1]===id);const related=adjacent.map(([a,b,label])=>{const other=a===id?b:a;return `<button type="button" data-related="${other}"><span>${byId[other].title}</span><small>${a===id?'延伸：':'連回：'}${label}</small></button>`}).join('');detail.innerHTML=`<div class="chapter">${groups[n.g].name} ／ ${idx+1} / ${concepts.length}</div><h2 tabindex="-1">${n.title}</h2><p class="summary">${n.summary}</p>${n.body}<div class="links-row"><a href="遊戲式學習_重點複習講義.html#p${n.page}" target="_blank" rel="noopener">講義第 ${n.page} 頁</a><a href="遊戲式學習_重點複習講義.pdf#page=${n.page}" target="_blank" rel="noopener">PDF 對應頁</a></div><div class="quiz"><strong>想一想</strong><p>${n.q}</p><details><summary>查看參考回答</summary><p>${n.a}</p></details></div><section class="related"><h3>相關連結</h3>${related}</section><details class="sources"><summary>資料來源</summary><p>${sources}</p></details><div class="reader-nav"><button type="button" data-step="-1" ${idx===0?'disabled':''}>前一個概念</button><button type="button" data-step="1" ${idx===concepts.length-1?'disabled':''}>下一個概念</button></div>`;detail.querySelectorAll('[data-related]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.related)));detail.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{const next=concepts[idx+Number(b.dataset.step)];if(next)select(next.id)}));reader.scrollTop=0;highlight();document.getElementById('reading-count').textContent=`本次已開啟 ${visited.size} / 16`;document.getElementById('reading-progress').value=visited.size;document.getElementById('status').textContent=`已開啟 ${visited.size} / ${concepts.length} 個概念`;document.getElementById('announcement').textContent=`已選取「${n.title}」，內容顯示於閱讀區。`;if(updateHash){try{history.replaceState(null,'',`#${id}`)}catch{}const heading=detail.querySelector('h2');heading.focus({preventScroll:true});heading.scrollIntoView({block:'start',behavior:'instant'});}}
function setMode(value){mode=value;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));highlight();}
function setView(value){view=value;document.querySelector('.canvas').hidden=view!=='map';document.querySelector('.concept-list').hidden=view!=='list';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));document.querySelector('.map-toolbar .hint').textContent=view==='map'?'點選閱讀 · 拖曳移動 · 按鈕縮放':'選取概念後，往下或右側閱讀';}
function updateBox(){svg.setAttribute('viewBox',`${box.x} ${box.y} ${box.w} ${box.h}`);document.getElementById('zoom-value').textContent=`${Math.round(zoom*100)}%`;}
function zoomTo(next,anchor){const z=Math.max(.65,Math.min(3.5,next));const w=1100/z,h=800/z,c=anchor||{x:box.x+box.w/2,y:box.y+box.h/2};const rx=(c.x-box.x)/box.w,ry=(c.y-box.y)/box.h;box={x:c.x-w*rx,y:c.y-h*ry,w,h};zoom=z;updateBox();}
function reset(){box={x:0,y:0,w:1100,h:800};zoom=1;updateBox()}
function svgPoint(e){const matrix=svg.getScreenCTM();if(!matrix)return null;return new DOMPoint(e.clientX,e.clientY).matrixTransform(matrix.inverse())}
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=svgPoint(e);if(!p)return;drag={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,worldX:p.x,worldY:p.y,origin:{...box},moved:false};suppressClick=false;});
svg.addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY)>6){drag.moved=true;svg.setPointerCapture(e.pointerId);svg.classList.add('panning');}if(!drag.moved)return;const matrix=svg.getScreenCTM();if(!matrix)return;const scale=matrix.a;box.x=drag.origin.x-(e.clientX-drag.startX)/scale;box.y=drag.origin.y-(e.clientY-drag.startY)/scale;updateBox();});
function endDrag(e){if(!drag||drag.pointerId!==e.pointerId)return;suppressClick=drag.moved;if(svg.hasPointerCapture(e.pointerId))svg.releasePointerCapture(e.pointerId);drag=null;svg.classList.remove('panning');setTimeout(()=>{suppressClick=false},0)}svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);svg.addEventListener('pointerleave',e=>{if(drag&&!drag.moved)endDrag(e)});

const search=document.getElementById('search'),results=document.getElementById('search-results'),clear=document.querySelector('.clear-search');
function closeSearch(){results.hidden=true;search.setAttribute('aria-expanded','false')}
function doSearch(){const q=search.value.trim().toLocaleLowerCase();clear.hidden=!q;results.replaceChildren();if(!q){closeSearch();return}const found=concepts.filter(n=>(n.title+' '+n.sub+' '+n.summary+' '+n.body.replace(/<[^>]+>/g,' ')).toLocaleLowerCase().includes(q));results.hidden=false;search.setAttribute('aria-expanded','true');if(!found.length){const p=document.createElement('p');p.textContent='找不到這個詞。可試「目標」「AI」「依變項」或「合作」。';results.append(p);return}found.forEach(n=>{const b=document.createElement('button');b.type='button';const name=document.createElement('span'),sub=document.createElement('small');name.textContent=n.title;sub.textContent=n.sub;b.append(name,sub);b.addEventListener('click',()=>{select(n.id);closeSearch();});results.append(b);});}
search.addEventListener('input',doSearch);search.addEventListener('keydown',e=>{if(e.key==='Escape')closeSearch();if(e.key==='ArrowDown'){e.preventDefault();results.querySelector('button')?.focus();}if(e.key==='Enter'){const b=results.querySelector('button');if(b){e.preventDefault();b.click();}}});results.addEventListener('keydown',e=>{const bs=[...results.querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const step=e.key==='ArrowDown'?1:-1;bs[(i+step+bs.length)%bs.length]?.focus();}if(e.key==='Escape'){closeSearch();search.focus();}});clear.addEventListener('click',()=>{search.value='';doSearch();search.focus()});document.addEventListener('click',e=>{if(!e.target.closest('.search'))closeSearch()});window.addEventListener('hashchange',()=>select(location.hash.slice(1),false));

<script>
'use strict';
const tfQuestions=[
["機器人迷宮以「找出並修正指令錯誤」作為過關條件。若課程目標是除錯能力，這項過關條件能讓核心玩法與學習目標相互對應。", true, "core", "玩家為了過關必須執行指令、比較預期與實際結果並修正錯誤，這些正是目標技能。是否真正學會仍需評量，但玩法已提供對應的練習機會。"],
["歷史遊戲要求玩家點擊發亮的人物，答對年代題才能獲得裝備。因為人物與題目都出自同一歷史時期，可以把點擊操作視為歷史推理的練習。", false, "core", "相同主題建立了情境連結，卻不表示操作練到歷史推理。若目標是推理，任務應要求比較史料、判斷證據或說明事件關係，而非只辨認發亮位置與回憶年代。"],
["某遊戲原本要比較資源方案才能過關，改版後可反覆點擊領取資源通關。題材與教材都沒變，因此仍提供相同的決策能力練習。", false, "core", "資源取得規則改變後，玩家可能繞過比較方案的思考。判斷融合程度要看實際需要的行動；教材不變，並不代表核心學習機會也不變。"],
["評估一款環境遊戲是否支持系統思考時，先追查「玩家的哪些決策會改變哪些結果」，比先計算它包含多少遊戲元素更切合目標。", true, "core", "系統思考關注關係與後果，因此需要檢查決策是否要求理解相互影響。遊戲元素的數量能描述外觀與功能，無法直接說明練習到何種思考。"],
["兩組學生使用相同教材，其中一組多了故事、徽章與排名；這樣的設計已讓兩組在核心學習任務上形成差異。", false, "core", "故事、徽章與排名可能改變參與方式，但若學生做的題目與思考要求相同，核心學習任務未必改變。要主張任務不同，需指出必要操作或認知要求的具體差異。"],
["一款辯論遊戲以「用證據回應對方理由」取得進展；即使沒有積分排行榜，仍可從規則與目標的對應討論它的學習融合。", true, "core", "積分不是判斷融合的必要依據。此例的進展規則要求證據使用與論證，能對應相關學習目標；也應檢查規則是否確實被執行及學生的論證品質。"],
["目標寫成「學生在課堂結束前完成三個水資源關卡」，已足以用來判斷學生能否解釋水資源分配的取捨。", false, "goals", "完成數與期限清楚，但未界定學生要展現的解釋能力。可補上「比較兩個分配方案，依限制條件說明取捨」及理由品質規準，才有判斷目標能力的依據。"],
["目標是「依兩項限制比較方案並提出理由」，評量要求學生說明未採用另一方案的原因，有助於檢查目標中的比較能力。", true, "goals", "說明未採用方案的原因，可以呈現學生是否比較限制與代價。評分仍需依理由是否切合條件，不能只看有沒有寫出一段文字。"],
["遊戲畫面把任務寫成「讓城鎮度過缺水期」，教案則寫「分析分配策略的代價」。只要任務確實要求分析代價，兩種目標表述可以並存。", true, "goals", "玩家目標提供情境中的行動方向，學習目標說明預期能力。兩者用語可不同，重點是完成任務時確實用到目標能力，並有相應證據。"],
["老師把「了解合作」改為「課後填完五題合作感受問卷」，就完成了把合作能力寫成可評量學習目標的工作。", false, "goals", "問卷完成是活動行為，感受也不等於合作能力。目標可界定資訊分享、協調分工等表現，再以相應任務與規準評量；不能用工具完成情形取代能力描述。"],
["兩班的學習目標相同，但先備能力不同；設計者可以調整提示量與任務進程，同時保留共同的最終表現標準。", true, "goals", "目標與達成目標的支持方式可以分開設計。差異化提示協助不同起點的學生前進；若要比較最終獨立能力，則應確認評量條件與標準一致。"],
["遊戲採取隱性學習目標時，老師在活動後請學生說出玩法與課程概念的關係，會使這項設計失去隱性整合的特性。", false, "goals", "把學習嵌入玩法，不表示必須隱瞞教育目的，也不排斥事後明確整理。活動後反思能協助學生把遊戲經驗連回概念，支持後續遷移。"],
["目標加入「在本單元結束時，根據資料比較兩種方案，理由符合三項規準」，比只加入完成期限更能支援後續評量設計。", true, "goals", "期限提供時間界線；任務、資料條件與品質規準進一步說明要觀察什麼。可衡量不只關乎數量，也關乎能否依明確標準判讀表現。"],
["學生能解釋談判原則，卻無法在角色任務中協調分工；這個落差提示設計者應增加技能練習與表現評量。", true, "ksa", "能說出原則提供知識證據，實際協調則涉及運用技能。兩者相關但不能互相取代，可增加有回饋的協調任務，觀察學生能否把知識用出來。"],
["某關卡要求分析三個證據並判斷主張，因為思考層次較高，這項目標在 KSA 中應歸為態度而非知識或技能。", false, "ksa", "KSA 區分知識、技能與態度；分析、評鑑則描述認知歷程。高層次思考不等於態度，仍需依目標內容判斷是在運用知識、展現技能，或形成價值取向。"],
["若合作目標同時包含「協調任務」與「願意聽取不同觀點」，可分別蒐集協調行為及面對分歧時的選擇理由。", true, "ksa", "合作可能同時涉及技能與態度。協調行為提供技能線索，選擇與理由可補充對他人觀點的態度證據；應避免用單一喜好分數涵蓋兩者。"],
["學生能在測驗中辨認正確的實驗步驟，因此在技能目標的評量上，可以用這項結果代替實際操作表現。", false, "ksa", "辨認步驟顯示相關知識，實際操作還涉及執行、監控與修正。若目標是操作技能，應安排實作或能充分呈現執行能力的任務，不能直接以辨認題替代。"],
["角色遊戲結束後，學生的環保態度分數提高，可據此判定他已具備分析能源方案的技能。", false, "ksa", "態度與技能是不同目標類型。態度分數可回應相關態度問題；分析能源方案的技能，還需要方案比較、理由或實際決策表現作為證據。"],
["為了練習方案規劃，讓學生多次提出方案、查看結果並修正，會比多次照抄同一成功方案提供更多策略調整的練習機會。", true, "ksa", "技能練習的重點是目標行動與回饋形成循環。提出、檢查與修正方案要求策略調整；照抄可能練到操作流程，卻較少要求學生自行規劃。"],
["學生口頭能正確解釋概念，卻在限時拖曳題頻繁失敗；此時最直接的改版是增加同概念的講解文字。", false, "learner", "口頭表現與操作失敗的落差提示可能存在介面或時間負荷問題。應先觀察拖曳操作與規則理解，再決定是否補概念；增加文字不一定處理真正卡點。"],
["兩組學生前測概念分數相近，但一組不熟悉遊戲操作；在比較學習表現前，提供共同的操作練習有助於減少介面熟悉度的干擾。", true, "learner", "概念程度相近不代表數位操作能力相同。共同操作練習能幫助學生理解介面，並讓後續表現更容易解讀；仍需留意其他組間差異。"],
["分析發現學生普遍偏好競爭，因此即使課程重點是資訊共享，設計時仍應以個人搶答排名作為主要成功條件。", false, "learner", "偏好是設計資訊之一，還要檢查機制與目標是否相容。若成功條件鼓勵搶快而不分享，可能減少合作練習；可改設需要交換資訊的任務再考量競爭安排。"],
["試玩時先區分「不懂概念」「不懂規則」與「不會操作」三種卡點，有助於決定要修改教材、說明還是介面。", true, "learner", "相同的失敗結果可能來自不同原因。把錯誤連回具體歷程，能讓修改對準需求，避免把所有問題都當作學科能力不足。"],
["新手與熟練者都能很快完成同一關，仍應查看兩者的作答理由與操作歷程，再決定是否提高概念難度。", true, "learner", "完成速度可能來自理解、熟悉介面或猜測。判斷能力需要更多與目標相關的證據，才能決定增加挑戰或補強支持，而非只依速度調整。"],
["同年齡學生使用同一套教材時，可以把學習者分析集中在共同興趣，先備概念差異可等到最後測驗再處理。", false, "learner", "年齡相同仍可能有不同先備知識與支持需求。若等到最後才處理，關卡與提示可能已不合適；設計前與試玩時都應蒐集與任務相關的起點資訊。"],
["目標要求學生比較資源分配方案，因此把「說明分配理由」納入過關條件，比只增加資源種類更直接對應目標。", true, "mechanics", "更多資源可能增加複雜度，卻不一定促使學生比較與解釋。把理由品質納入任務規則，才能讓目標行動成為成功所需的一部分。"],
["七步驟把成效評估列在測試調整之後，所以原型試玩以找出操作錯誤為主，學習證據適合留到正式活動才蒐集。", false, "mechanics", "試玩也能檢查學生是否做出預期的思考與行動。及早蒐集學習線索可發現目標、機制與回饋不一致之處，避免只修好操作卻保留學習設計問題。"],
["某合作任務讓每人獨立答題，最後加總分數；由於採用團隊計分，已能在機制上要求學生協調解題策略。", false, "mechanics", "團隊計分建立共同結果，但不一定要求互動。若要練習協調，可加入資訊互補、共同決策或需要整合彼此方案的條件，讓協調成為必要行動。"],
["試玩發現學生能靠反覆碰運氣過關，設計者修改規則，要求先提交預測再驗證；這可視為依試玩結果回頭調整核心機制。", true, "mechanics", "設計步驟可以反覆迭代。加入預測與驗證是針對「猜測也能通關」的問題修改必要行動，使玩法更有機會對應推理目標。"],
["如果研究要比較兩種回饋方式，讓兩版使用相同任務與成功條件，有助於減少機制差異對結果解讀的影響。", true, "mechanics", "任務與規則本身也會影響學習。保持它們相近，能讓比較更聚焦回饋差異；仍需處理先備能力、時間等其他可能干擾因素。"],
["原型的完成率偏低，為了提升學習機會，先把所有限制條件移除，通常比追查失敗原因更能維持原本的問題解決目標。", false, "mechanics", "限制條件可能正是目標思考的來源；移除後可能讓任務失去取捨。應先辨認是概念、操作、規則或挑戰量的問題，再調整相應條件。"],
["生態遊戲在每關前播放食物網介紹，過關則靠點擊速度；由於介紹內容會出現在關卡背景中，可把此設計歸為內生整合。", false, "integration", "內容出現在介紹與背景，不代表它構成玩法規則。若過關靠點擊速度，玩家不必運用食物網關係；內生整合需要概念直接影響決策與結果。"],
["橋梁遊戲讓結構承載結果依玩家的支點與材料選擇改變；若關係符合課程中的結構原理，可用它說明因果映射。", true, "integration", "因果映射把學科關係轉成遊戲運作規則。玩家的設計選擇產生對應結果，提供觀察與修正的機會；模擬關係仍需確認正確且適合課程範圍。"],
["同樣是答題領金幣，若金幣只用來購買與學科無關的裝飾，通常較接近外生整合，即使題目品質很好也是如此。", true, "integration", "整合類型看學習內容與核心玩法的關係。題目品質好不會自動改變金幣與內容之間的獎勵連結；外生分類也不代表沒有學習價值。"],
["把資源限制納入玩法後，學生必須取捨，所以無須再檢查取捨是否依據課程概念，就能判定是有效的內容整合。", false, "integration", "取捨可能依運氣、外觀偏好或任意規則進行。需要確認限制與後果是否反映目標概念，以及學生是否真的運用它們；存在策略選擇不等於已有效整合。"],
["兩款遊戲一款採內生整合、一款採答題獎勵；要比較學習效果，仍應對照目標、教學時間與評量證據，而非以類型直接排序。", true, "integration", "整合類型描述設計關係，成效則需要資料。目標適切性、支持品質與評量條件都可能影響結果，因此不能把分類當作效果排名。"],
["某遊戲教的是資料判讀，但其資源交換價格由隨機抽籤決定；只要玩家會比較價格，便能認定交換機制已映射教材中的資料關係。", false, "integration", "比較價格可能是一般策略行為，未必反映指定資料的規律。因果映射須指出課程中的哪個關係如何決定遊戲結果，不能只因存在數字或比較就認定成立。"],
["學生在模擬遊戲中反覆成功，表示內容已內化，因此事後再請他比較遊戲規則與真實情境，對概念遷移的設計沒有必要。", false, "integration", "遊戲內成功可能依賴熟悉規則。比較模擬與真實情境的共同原理及限制，有助於把經驗整理成可轉用的知識；遷移仍需在新任務中觀察。"],
["初學者先用半完成的策略規劃表，熟悉後改用空白表，最後自行規劃；這種支持逐步撤除能用來檢查獨立表現。", true, "scaffolding", "鷹架協助學生完成當下尚難獨立處理的任務，之後應觀察減少支持時能否自行運用。逐步撤除支持，比一直保留完整提示更能看出獨立能力。"],
["學生靠逐步提示完成任務，下一關只縮短作答時間而保留同樣提示，就足以檢查他是否已能獨立運用概念。", false, "scaffolding", "縮短時間主要改變速度壓力，完整提示仍可能支撐關鍵判斷。檢查獨立運用需適度減少提示，並觀察學生是否能自行選擇、解釋與修正。"],
["系統發現學生連錯三次，就自動降低概念層次；這種只依連錯次數調整的方式，已能區分概念不足和操作困難。", false, "scaffolding", "連錯次數顯示困難，卻沒有說明原因。若問題在操作，降低概念層次可能無助於解決；需要結合錯誤類型、歷程或學生說明再決定支持方式。"],
["學生已能穩定解釋單一條件的影響，下一關加入第二個相互作用的條件，並提供關係整理表，是一種漸進增加概念要求的安排。", true, "scaffolding", "新關卡增加需要整合的關係，同時提供整理支持，讓挑戰接續既有能力。是否適當仍需觀察學生表現，必要時調整條件數與支持量。"],
["提示讓學生找出自己的錯誤後，再安排一次沒有同樣提示的相近任務，可以補充他是否能自行修正的證據。", true, "scaffolding", "有提示時的成功與獨立修正不同。相近的無提示任務能檢查學生是否掌握修正方法；若要主張遷移到不同情境，還需安排相應的新任務。"],
["某關卡讓多數學生感到輕鬆愉快，因此設計者可據此判定挑戰與能力已達良好配合，不必查看他們是否在練習新能力。", false, "scaffolding", "愉快可能來自適切挑戰，也可能因任務過於簡單。挑戰與能力的配合需結合能力表現與任務要求判斷，不能以愉快感取代學習挑戰的檢查。"],
["團隊任務由一位熟練者操作，其他人觀看，最後全隊通關；這項共同結果可作為每位成員合作能力進步的證據。", false, "social", "共同結果未呈現每個人的參與與協調。需要觀察資訊分享、回應分歧及共同修正等行為；一人帶領通關可能讓部分成員缺乏練習機會。"],
["讓各角色掌握不同但互補的資訊，再要求提出共同方案，比只把學生分成小組更能在任務中創造協商需求。", true, "social", "資訊互補使成員需要交換與整合觀點，形成協商機會。分組本身不保證互動；仍應觀察資訊是否實際分享及決策是否共同進行。"],
["學生在角色扮演中選擇保護弱勢角色並獲得高分，這項選擇足以區分他是認同公平價值，還是為了獎勵而選擇。", false, "social", "同一選擇可能出自不同動機。可進一步詢問理由，改變獎勵或情境條件後觀察選擇，補充態度證據；一次高分行動無法區分這些原因。"],
["角色衝突任務結束後，請學生說明不同角色面對的限制與自己改變決策的理由，有助於把扮演經驗連回觀點理解。", true, "social", "角色扮演提供經驗，反思則協助辨認立場、限制與決策依據。這比只問角色是否有趣，更切合觀點理解與決策反思的目標。"],
["遊戲加入安全重試後，學生能隨時換選項看結局；因此即使沒有討論選擇後果，也能把重試次數直接視為反思程度。", false, "social", "重試可能是比較後果，也可能只是試遍選項。要判斷反思，應查看學生是否分析原因、調整理由或連結概念；次數本身不能呈現思考品質。"],
["合作任務中，評量同時記錄學生如何回應不同意見與團隊方案如何修正，比只記錄聊天訊息總數更貼近協商品質。", true, "social", "回應與修正能呈現意見如何被理解、整合及採用。訊息數僅反映互動量，可能包含無關討論，不能直接代表協商品質。"],
["學生預測正確卻在操作時漏掉一步，回饋先提示檢查操作序列，比重新講解整套概念更貼近已觀察到的錯誤。", true, "feedback", "診斷式回饋應依據具體卡點。此例已有預測理解的線索，而失敗發生在操作序列，先引導檢查該步驟能讓回饋更有針對性。"],
["兩位學生得到相同錯誤答案，系統便給同一段概念講解；只要講解內容正確，就能把此機制稱為依個別錯誤原因提供的診斷回饋。", false, "feedback", "相同答案可能來自不同推理或操作問題。正確講解不等於已辨認個別原因；需參考作答歷程、理由或錯誤步驟，才能做更有依據的診斷。"],
["回饋先請學生找出「預測與結果首次不同的步驟」，再提供針對該步驟的提示，有助於把結果回饋轉成修正行動。", true, "feedback", "單純知道失敗不一定知道如何改。定位預測落差，能把回饋連回可檢查的步驟，再讓學生嘗試修正，形成回饋循環。"],
["AI 的提示引用了學生上一輪的操作，因此即使未核對提示中的學科推論，也可優先將它視為可靠的診斷依據。", false, "feedback", "引用操作紀錄讓回饋具體，但不保證學科推論正確。仍須核對概念、限制條件及錯誤原因，避免看似個人化的提示引導學生走向錯誤解釋。"],
["學生連續作答後出現「進步很多」徽章，這項回饋已能告訴他下一次應如何修正概念錯誤。", false, "feedback", "徽章可標記進展或提供鼓勵，但沒有指出錯在哪裡及如何改。修正概念還需可理解的原因、線索或檢查方向；獎勵與診斷回饋的功能不同。"],
["評估提示是否有用時，除了看提示後是否通關，也追蹤學生在後續相近題能否減少同類錯誤，能補充學習上的證據。", true, "feedback", "當次通關可能依賴提示直接支援。後續同類錯誤是否減少，有助於判斷是否學到可再次運用的方法；仍需留意題目與支持條件是否相近。"],
["兩位學生都點了五次提示，研究者據此將他們的自我調節能力評為相同，這樣可避免主觀判斷。", false, "srl", "次數相同不代表求助時機與使用方式相同。一人可能先診斷再求助，另一人可能直接索取答案；應結合策略、時機與後續修正判讀自我調節。"],
["學生發現原策略無效，說明卡點後主動請求提示，再自行修改方案；這個歷程可作為自我調節的行為線索。", true, "srl", "自我調節包含監控、策略調整與適切求助，不等於完全不求助。此例呈現學生辨認問題並運用支援的過程，適合進一步分析其品質。"],
["遊戲保留「原訂目標、實際結果、下一輪策略」三項紀錄，能為分析學生是否依差距調整行動提供資料。", true, "srl", "這三項紀錄串連目標、監控與調整，貼近自我調節歷程。仍須判讀內容是否具體且與實際行動一致，不能只計算欄位是否填滿。"],
["學生這次完全沒使用提示，且完成時間最短，因此可把他列為班上自我調節表現最好的人。", false, "srl", "少用提示與速度快可能源於先備能力、任務簡單或猜測。自我調節應看如何設定目標、監控與調整；不用提示本身不是能力排名的充分依據。"],
["若要知道學生是否根據回饋調整策略，比較他在收到回饋前後的方案與理由，會比只問他覺得回饋有沒有幫助更直接。", true, "srl", "方案及理由的變化呈現實際策略調整，自評有幫助則偏向主觀感受。兩者可互補，但要回答是否調整，應優先蒐集相關行為證據。"],
["研究同時測量成就與自我調節，便能把自我調節視為介入提升成就的中介歷程，即使尚未分析三者的關係。", false, "srl", "測量兩種結果不會自動建立中介角色。需要先提出介入如何透過自我調節影響成就的機制，再用適當設計與分析檢查相關路徑。"],
["遊戲讓學生選策略、看見可理解的進展，並與同伴互相支持；可分別從自主感、勝任感與關係感討論這些安排。", true, "theory", "這些安排分別對應自我決定理論關注的三種需求。理論提供設計與解釋方向，是否真的提升需求滿足或學習效果，仍需資料檢查。"],
["遊戲讓學生自行選擇角色服裝，便足以說明他們在學習策略上具有自主決定的空間。", false, "theory", "外觀選擇是一種選擇，但不一定影響學習行動。若主張策略自主，需要讓學生能在有意義的任務路徑、方法或決策中做選擇。"],
["學生在高難度關卡停留很久而且持續重試，這項紀錄已能區分他是在心流狀態，還是因挫折而難以離開。", false, "theory", "停留與重試可由多種經驗造成。討論心流需關注挑戰與能力配合、投入等相關證據，不能只由時間長短推定，也不能排除挫折。"],
["設計者以建構主義說明「先讓學生提出預測，再比較結果並修正解釋」，其中關鍵是學生把新經驗與既有理解連結。", true, "theory", "建構主義重視學習者主動形成與修正理解。預測、比較與解釋能讓既有想法與新經驗互相對照；操作本身還需搭配意義建構。"],
["只要把練習題放進醫院場景並使用醫師角色，就能據此判定學生正在進行情境學習中的專業判斷。", false, "theory", "場景與角色提供外在情境，專業判斷還需要使用相關資訊、限制與決策方式。若仍是脫離情境的記憶題，場景包裝不等於有意義的情境應用。"],
["研究以自我決定理論提出設計理由，再用量表測量勝任感時，應區分「理論」「勝任感構念」與「量表工具」三者。", true, "theory", "理論說明概念及關係，勝任感是要研究的心理構念，量表是取得觀察資料的工具。區分三者有助於避免把工具名稱當成理論解釋。"],
["學生在熟悉的農場遊戲成功後，改用文字資料分析不同地區的資源分配；若仍需運用相同原理，這可用來觀察跨情境應用。", true, "transfer", "新的呈現與情境要求學生辨認可共用的原理，較能提供遷移線索。任務仍需對應原目標，並避免把額外閱讀負荷誤認為概念能力差異。"],
["學生一週後重玩相同地圖仍然通關，這項結果主要證明他能把知識遷移到新的問題情境。", false, "transfer", "隔一段時間在相同任務表現，較接近保留或熟悉度的證據。遷移需觀察不同情境或問題中的運用，不能只由延後重玩同一地圖判定。"],
["遊戲後的反思要求學生依序列出做過哪些操作，即使未說明原因或連結概念，也已完成把經驗轉成可遷移知識的設計。", false, "transfer", "回顧操作有助於整理經驗，但還需要解釋為何產生結果、連結概念及辨認適用條件。僅重述流程，未必形成可在新情境中使用的理解。"],
["討論「遊戲中有效的策略，在真實情境下何時可能失效」，能幫助學生辨認模擬規則與現實條件之間的界線。", true, "transfer", "遷移需要知道原理適用的條件，也需要辨認簡化與限制。討論失效情境可避免學生把遊戲中的固定規則不加區分地套到現實。"],
["若目標是概念遷移，讓學生在新題目中解釋採用原理的理由，通常比只更換原題的人名與背景圖片更切合評量目的。", true, "transfer", "遷移重點在新情境中辨認並運用原理。只換表面元素可能仍可照原步驟作答；說明適用理由能補充學生是否真正理解關係的證據。"],
["學生在遊戲內能背出解題規則，表示他已掌握該規則在新情境中的適用條件，可省去新任務的檢查。", false, "transfer", "背出規則是知識回憶的證據，辨認適用條件與實際轉用則是不同要求。需要新任務中的選擇與理由，檢查學生是否能判斷何時及如何使用。"],
["學習目標是推理，但遊戲總分混合速度、抽獎與答題分數；若總分提高，便可用它直接代表推理能力的進步幅度。", false, "assessment", "總分包含與推理不同的成分，變化可能來自速度或運氣。應分開目標相關表現，結合推理任務與規準，才能更合理解讀能力變化。"],
["學生自評更喜歡課程，但推理任務表現沒有明顯改變；報告可分別呈現參與感受與學習表現，避免把兩者合併成單一成效。", true, "assessment", "感受與推理能力回應不同問題，結果可以不一致。分別報告有助於說明設計可能改善哪一面向，以及哪些學習主張尚未得到支持。"],
["評量合作時，把資訊分享、協調與處理分歧列成規準，並搭配實際任務觀察，比只採用團隊通關數更貼近合作目標。", true, "assessment", "合作規準能直接觀察目標行為；通關數可能受到個人能力或任務容易度影響。評分時也應確認規準定義清楚且能一致使用。"],
["平台不打斷遊戲就記錄點擊與停留時間，因此這些紀錄天然具備隱性評量的效度，不需另說明與學習能力的關係。", false, "assessment", "不打斷活動只是蒐集方式。要把紀錄當成能力證據，仍須說明指標與構念的關係並檢查其他解釋，否則點擊可能只是介面操作。"],
["為了公平比較兩組理解程度，只要讓兩組做相同測驗，即使一組考試時可看逐步答案提示，也能視為相同評量條件。", false, "assessment", "題目相同不代表支持條件相同。逐步答案提示可能改變所需獨立能力；比較時需統一支持，或清楚限定結論為各自支持條件下的表現。"],
["學生在操作任務得分高卻無法說明理由時，可將這個不一致當作補充檢查的線索，而非直接刪除其中一種證據。", true, "assessment", "操作與解釋可能反映不同面向，也可能受到提示、熟悉度或表達能力影響。保留並分析不一致，能幫助釐清評量測到什麼。"],
["前後測平均分數提高，但沒有比較組與其他資料時，最合適的結論是遊戲機制已造成這次進步。", false, "assessment", "前後變化提供進步線索，卻可能同時受熟悉題目、其他教學或時間影響。可以描述觀察到的變化，但要把效果歸因於機制，需要更充分的設計與證據。"],
["把「推理能力」具體寫成「比較兩個方案，依證據與理由連結的品質評分」，是在把抽象構念轉成可觀察的任務與指標。", true, "operational", "操作型定義需要說明如何觀察與判分。此例提供任務與品質方向，實作時還應明定評分規準及施測時間，讓結果能被一致解讀。"],
["研究把變項命名為「高層次思考」，並指定使用線上測驗，這樣就已完成該變項的操作型定義。", false, "operational", "名稱與平台仍未說明學生要做什麼、如何計分及何時測量。需補上題目或任務要求與評分依據，才能判斷測到的是哪一種思考表現。"],
["兩篇研究都稱測量「投入」，一篇用停留時間、一篇用主動修正策略；比較結果前應先核對它們實際觀察的面向。", true, "operational", "同名構念可能用不同指標表徵，停留與策略修正不一定相同。比較時需理解各自操作方式及限制，避免只因名稱一致就當成同一證據。"],
["為了讓「問題解決能力」容易量化，直接定義為按鈕點擊次數，已比使用任務評分規準更能確保測量貼近目標。", false, "operational", "容易計數不等於貼近構念。點擊可能反映探索、困惑或操作習慣；問題解決評量需能呈現分析、策略與修正品質，並說明指標的解釋依據。"],
["學生在提示開放時與提示關閉時得到相同分數，因分數相同，兩次測量就可以視為同樣的獨立能力證據。", false, "operational", "相同分數可能在不同支持條件下取得，代表的能力要求可能不同。操作型定義應交代提示與任務條件，才不會把有協助與獨立表現混為一談。"],
["如果要比較策略修正品質，事先定義「修正是否回應失敗原因」的評分標準，比事後依研究者印象選出好策略更容易核對。", true, "operational", "明確規準能讓評分與構念的關係可檢查，也有助於一致判讀。仍需確認標準適合任務，並檢查不同評分者的理解與使用情形。"],

function tfEmphasize(text,phrases){
 const escape=value=>value.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 const ranges=phrases.map(phrase=>({start:text.indexOf(phrase),length:phrase.length})).filter(range=>range.start>=0&&range.length>0).sort((a,b)=>a.start-b.start||b.length-a.length);
 let html='',cursor=0;
 for(const range of ranges){
  if(range.start<cursor)continue;
  html+=escape(text.slice(cursor,range.start))+'<strong class="tf-keyword">'+escape(text.slice(range.start,range.start+range.length))+'</strong>';
  cursor=range.start+range.length;
 }
 return html+escape(text.slice(cursor));
}
const tfTotal=tfQuestions.length;

const tfObsoleteKeys=['gbl-tf-20261018-v1','gbl-review-cards-v2'];
const tfIds=tfQuestions.map(q=>q.id);
const tfOwn=(obj,key)=>Object.prototype.hasOwnProperty.call(obj,key);
const tfValidId=id=>Number.isInteger(id)&&id>=1&&id<=tfTotal;
const tfObject=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
const tfFresh=()=>({version:2,answers:{},mistakes:{},current:1,round:null,roundSerial:0});
let tfState=tfFresh(),tfStorageOK=true,tfCorrupt=false,tfMigration='';
function tfReadAnswers(value,ids=tfIds){const out={};if(tfObject(value))for(const id of ids)if(typeof value[id]==='boolean')out[id]=value[id];return out;}
function tfReadState(value){
 if(!tfObject(value)||value.version!==2||!tfObject(value.answers)||!tfObject(value.mistakes))throw Error('Invalid review state');
 const state=tfFresh();state.answers=tfReadAnswers(value.answers);state.current=tfValidId(value.current)?value.current:1;
 for(const id of tfIds){const r=value.mistakes[id];if(tfObject(r)){state.mistakes[id]={errors:Number.isSafeInteger(r.errors)&&r.errors>0?r.errors:1,streak:Number.isInteger(r.streak)&&r.streak>=0&&r.streak<=2?r.streak:0};}}
 for(const q of tfQuestions)if(tfOwn(state.answers,q.id)&&state.answers[q.id]!==q.answer){state.mistakes[q.id]??={errors:1,streak:0};state.mistakes[q.id].streak=0;}
 state.roundSerial=Number.isSafeInteger(value.roundSerial)&&value.roundSerial>=0?value.roundSerial:0;
 const r=value.round;
 if(tfObject(r)&&Array.isArray(r.ids)&&r.ids.length>0&&r.ids.length<=tfTotal&&r.ids.every(tfValidId)&&new Set(r.ids).size===r.ids.length&&r.ids.every(id=>state.mistakes[id])&&Number.isSafeInteger(r.id)&&r.id>0){
  const responses=tfReadAnswers(r.responses,r.ids),complete=r.ids.every(id=>tfOwn(responses,id));
  // Keep only consistent round snapshots; never infer that an incomplete round earned credit.
  if((r.applied===true&&complete)||(r.applied===false&&!complete)){
   state.round={id:r.id,ids:[...r.ids],responses,applied:r.applied};state.roundSerial=Math.max(state.roundSerial,r.id);
  }
 }
 return state;
}

 tfCard.innerHTML=`<h3 class="book-title" data-card-focus tabindex="-1">我的錯題本</h3><p class="book-intro">錯過的題目會留在這裡。完成兩輪且連續答對後，才移到「已熟悉」；再次答錯會回到待複習。</p><div class="book-tabs" aria-label="錯題狀態"><button data-book-tab="pending" aria-pressed="${tfBookTab==='pending'}">待複習 ${pending}</button><button data-book-tab="mastered" aria-pressed="${tfBookTab==='mastered'}">已熟悉 ${mastered}</button></div><div class="book-start"><p>${ready?'每輪每題只計一次；完成整輪後可開始下一輪。':`先完成全部 100 題，再集中重練。目前還有 ${remaining} 題未作答；現在可以先閱讀課程卡。`}</p><button type="button" class="card-primary" data-action="round" ${ready&&(pending||tfRoundActive())?'':'disabled'}>${tfRoundActive()?'接續未完成的輪次':'開始錯題複習'}</button><button data-action="continue">${ready?'回到題目':'繼續未作答題目'}</button></div>${ids.length?`<ul class="mistake-list">${ids.map(id=>{const q=tfQuestions[id-1],m=tfState.mistakes[id];return `<li><div><span class="question-number">第 ${id} 題</span><strong>${byId[q.node].title}</strong></div><p>${tfEmphasize(q.text,tfHighlights[q.id-1][0])}</p><small>答錯 ${m.errors} 次 · ${m.streak>=2?'已熟悉':`連續答對 ${m.streak} / 2 輪`}</small><div class="mistake-actions"><button data-study-id="${id}">看課程卡</button>${tfBookTab==='mastered'?`<button data-retry-id="${id}">重新挑戰</button>`:''}</div></li>`;}).join('')}</ul>`:`<div class="tf-empty"><p>${tfBookTab==='mastered'?'完成兩輪且連續答對後，題目會出現在這裡。':'目前沒有待複習的錯題。可以繼續練習，或回顧已熟悉的內容。'}</p></div>`}`;
}
function tfShowRecap(id){tfRecapIds=tfMistakeIds('all');if(!tfRecapIds.length)return;tfRecapIndex=Math.max(0,tfRecapIds.indexOf(id));tfMode='recap';tfRender();tfFocus();}
function tfRenderRecap(){
 tfCard.classList.add('is-flashcard');const id=tfRecapIds[tfRecapIndex],q=tfQuestions[id-1],n=byId[q.node],m=tfState.mistakes[id];
 tfCard.innerHTML=`<div class="tf-meta"><span class="question-number">課程卡 ${tfRecapIndex+1} / ${tfRecapIds.length}</span><span>來自第 ${id} 題</span></div><h3 class="recap-title" data-card-focus tabindex="-1">再記一次：${n.title}</h3><p class="mastery-note">${m.streak>=2?'已熟悉，仍可回顧':`待複習 · 連續答對 ${m.streak} / 2 輪`}。看卡片不計入答對輪次。</p><section class="answer-reason"><div class="answered-question"><h4>題目</h4><p>${tfEmphasize(q.text,tfHighlights[q.id-1][0])}</p><p>正確答案：${q.answer?'是':'非'}</p></div><h4>本題為什麼？</h4><p>${tfEmphasize(q.explanation,tfHighlights[q.id-1][1])}</p></section><div class="card-actions"><button data-action="recap-prev" ${tfRecapIndex===0?'disabled':''}>上一張</button>${tfRecapIndex<tfRecapIds.length-1?'<button class="card-primary" data-action="recap-next">下一張課程卡</button>':'<button class="card-primary" data-action="book">課程卡看完了</button>'}<button data-action="continue">${tfAllAnswered()?'回到題目':'繼續新題'}</button></div>${tfAllAnswered()&&(tfMistakeIds().length||tfRoundActive())?`<button class="recap-start" data-action="round">${tfRoundActive()?'接續未完成的錯題輪次':'開始錯題作答'}</button>`:''}${tfExtra(q,n)}`;
}
function tfRender(){
 const answered=tfIds.filter(tfHas).length,pending=tfMistakeIds().length,mastered=tfMistakeIds('mastered').length;
 document.getElementById('tf-stats').innerHTML=`<span>已作答<strong>${answered} / ${tfTotal}</strong></span><span>待複習<strong>${pending}</strong></span><span>已熟悉<strong>${mastered}</strong></span><span>完成輪次<strong>${tfState.roundSerial-(tfRoundActive()?1:0)}</strong></span>`;
 document.getElementById('tf-progress').value=answered;document.getElementById('tf-migration').textContent=tfMigration;document.getElementById('tf-migration').hidden=!tfMigration;
 const completion=document.getElementById('tf-complete');completion.hidden=answered!==tfTotal||tfMode!=='practice';completion.innerHTML=answered===tfTotal?`<strong>100 題已完成</strong><p>${pending?`有 ${pending} 題待複習，現在可以集中重練。`:'目前沒有待複習錯題，可回顧已熟悉的觀念。'}</p><button data-action="book">查看錯題本</button>${pending?`<button data-action="round">${tfRoundActive()?'接續錯題複習':'開始錯題複習'}</button>`:''}`:'';
 document.querySelectorAll('[data-tf-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tfFilter==='wrong'?tfMode==='book':tfMode==='practice'&&b.dataset.tfFilter===tfFilter)));
 tfOutline.hidden=tfMode==='book'||tfMode==='recap';document.querySelector('.tf-nav').hidden=tfMode==='book'||tfMode==='recap';
 document.getElementById('tf-outline-count').textContent=`${tfQueue.length} 題`;const grid=document.getElementById('tf-grid');grid.replaceChildren();
 if(!tfOutline.hidden)for(const id of tfQueue){const b=document.createElement('button'),round=tfMode==='review',done=round?tfOwn(tfState.round.responses,id):tfHas(id),bad=done&&(round?tfState.round.responses[id]!==tfQuestions[id-1].answer:tfWrong(id));b.type='button';b.className=done?(bad?'wrong':'correct'):'';b.setAttribute('aria-current',String(id===tfCurrent));b.setAttribute('aria-label',`第 ${id} 題，${done?(bad?'答錯':'答對'):'未作答'}`);b.innerHTML=`${id}<span aria-hidden="true">${done?(bad?'✗':'✓'):'○'}</span>`;b.dataset.goId=id;grid.append(b);}
 const pos=tfQueue.indexOf(tfCurrent);document.getElementById('tf-prev').disabled=pos<=0;document.getElementById('tf-next').disabled=pos<0||pos>=tfQueue.length-1;document.getElementById('tf-position').textContent=tfQueue.length?`${pos+1} / ${tfQueue.length}${tfMode==='review'?'（本輪錯題）':''}`:'無符合題目';
 const r=tfState.round;document.getElementById('tf-round-resume').hidden=!tfRoundActive()||tfMode==='review';
 document.getElementById('tf-priorities').innerHTML=`<h3>錯題會怎麼複習？</h3><p>完成 100 題後集中重練。每輪各答一次，連續兩輪答對標為已熟悉。</p>`;
 if(tfMode==='book')tfRenderBook();else if(tfMode==='recap')tfRenderRecap();else tfRenderQuestion();
 tfPanel.dataset.mode=tfMode;
 document.querySelector('.tf-nav').hidden=tfMode==='book'||tfMode==='recap'||tfCard.classList.contains('is-flashcard');
 document.getElementById('tf-mode-label').textContent=tfMode==='review'?`錯題複習 · 第 ${r.id} 輪`:tfMode==='recap'?'先溫習，再挑戰':tfMode==='book'?'留住每一次需要再想的觀念':'100 題中等難度練習';
}
// Delegation keeps replaced cards keyboard-operable without accumulating handlers.
tfPanel.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.tfAnswer!==undefined){tfAnswer(b.dataset.tfAnswer==='true');return;}
 if(b.dataset.reviewNode){tfClose(b.dataset.reviewNode);return;}
 if(b.dataset.nextId||b.dataset.goId){tfGo(Number(b.dataset.nextId||b.dataset.goId));return;}
 if(b.dataset.retryId){tfRestartQuestion(Number(b.dataset.retryId));return;}
 if(b.dataset.studyId){tfShowRecap(Number(b.dataset.studyId));return;}
 if(b.dataset.bookTab){tfShowBook(b.dataset.bookTab);return;}
 if(b.dataset.tfFilter){tfSetFilter(b.dataset.tfFilter);return;}
 const a=b.dataset.action;
 if(a==='book')tfShowBook();else if(a==='round')tfStartRound();else if(a==='continue')tfContinuePractice();else if(a==='all')tfPractice();else if(a==='recap-next'||a==='recap-prev'){tfRecapIndex=Math.max(0,Math.min(tfRecapIds.length-1,tfRecapIndex+(a==='recap-next'?1:-1)));tfRender();tfFocus();}
});
tfEntry.addEventListener('click',tfOpen);tfReturn.addEventListener('click',tfOpen);document.getElementById('reader-return').addEventListener('click',tfOpen);document.getElementById('map-entry').addEventListener('click',()=>tfClose());document.getElementById('tf-to-map').addEventListener('click',()=>tfClose());
document.getElementById('tf-prev').addEventListener('click',()=>{const i=tfQueue.indexOf(tfCurrent);if(i>0)tfGo(tfQueue[i-1]);});document.getElementById('tf-next').addEventListener('click',()=>{const i=tfQueue.indexOf(tfCurrent);if(i>=0&&i<tfQueue.length-1)tfGo(tfQueue[i+1]);});
document.getElementById('tf-reset').addEventListener('click',()=>{if(!confirm('清除本版全部答案、錯題與複習輪次？此動作無法復原。'))return;tfState=tfFresh();tfCurrent=1;tfMode='practice';tfQueue=[...tfIds];tfFilter='all';tfDraft=null;tfRecapIds=[];tfRecapIndex=0;tfCorrupt=false;tfMigration='';tfSave();tfRender();tfFocus();});
tfRender();tfSave();

</script>

</body>
</html>
